<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700&family=Pacifico&display=swap');

        body {
            background-color: #ffe6e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Nunito', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #ff4d4d;
            font-family: 'Pacifico', cursive;
            font-size: 3rem;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .gif-container {
            margin-bottom: 30px;
        }

        img {
            max-width: 300px;
            border-radius: 20px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 100px;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        #yes-btn {
            background-color: #ff4d88;
            color: white;
        }

        #yes-btn:hover {
            background-color: #ff1a66;
            transform: scale(1.05);
        }

        #no-btn {
            background-color: #ffffff;
            color: #ff4d88;
            border: 2px solid #ff4d88;
        }

        #no-btn:hover {
            background-color: #fff0f5;
        }
    </style>
</head>
<body>

    <div class="gif-container">
        <!-- Cute asking GIF (Peach and Goma bears) -->
        <img id="main-gif" src="https://media.tenor.com/efhiiv_a1BMAAAAi/peach-goma.gif" alt="Cute Bears">
    </div>

    <h1 id="question">Будеееешь со мной встречаться?</h1>

    <div class="buttons">
        <button id="yes-btn">Дааа!</button>
        <button id="no-btn">нет</button>
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const question = document.getElementById('question');
        const gif = document.getElementById('main-gif');

        const noTexts = [
            "Точно?",
            "Подумай о тех пионаах!",
            "Посмотри на свой браслетик и ответь снова",
            "Даже после браслетика :(",
            "А как же Астана :( ?",
            "А как же наш щеночек, которого мы заведем",
            "А как же совместные игры в валорант :("
        ];

        let noClickCount = 0;

        noBtn.addEventListener('click', () => {
            // Change the text of the NO button
            if (noClickCount < noTexts.length) {
                noBtn.innerText = noTexts[noClickCount];
            } else {
                noBtn.innerText = "Нуууууууу котик ;(";
            }
            noClickCount++;

            // Increase the size of the YES button
            const currentFontSize = window.getComputedStyle(yesBtn).getPropertyValue('font-size');
            const newSize = parseFloat(currentFontSize) * 1.4; // Grows by 40% each click
            
            // Apply new size and adjust padding so it scales nicely
            yesBtn.style.fontSize = `${newSize}px`;
            yesBtn.style.padding = `${newSize / 2}px ${newSize}px`;
        });

        yesBtn.addEventListener('click', () => {
            // Change GIF to a celebrating/hugging one 
            gif.src = "scary.jpg";
            
            // Update the text
            question.innerText = "Лав ю ❤️. Теперь этот язык твой )";
            
            // Hide the buttons
            yesBtn.style.display = 'none';
            noBtn.style.display = 'none';
        });
    </script>

</body>
</html>
